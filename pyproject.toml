[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe"
version = "0.1.0"
description = "Trajectory assertions and chaos testing for AI agents, as a pytest plugin."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pytest>=7"]
license = {text = "MIT"}

[project.optional-dependencies]
claude-demo = ["anthropic", "python-dotenv"]
ollama-demo = ["ollama"]

[project.entry-points.pytest11]
agentprobe = "agentprobe.plugin"

[tool.setuptools]
packages = ["agentprobe"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: hits the real Claude API (needs a key, costs money)",
    "local_llm: hits a local Ollama model (free, needs `ollama serve` running)",
]
