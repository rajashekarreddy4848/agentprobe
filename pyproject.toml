[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe"
version = "0.1.0"
description = "Trajectory assertions and chaos testing for AI agents, as a pytest plugin."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pytest>=7"]
license = {text = "MIT"}

[project.optional-dependencies]
claude-demo = ["anthropic", "python-dotenv"]
ollama-demo = ["ollama"]
api-demo = ["fastapi", "uvicorn", "requests"]
openai-demo = ["openai", "python-dotenv"]
mcp = ["mcp>=2.0", "ollama"]

[project.entry-points.pytest11]
agentprobe = "agentprobe.plugin"

[tool.setuptools]
packages = ["agentprobe", "agentprobe.adapters"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: hits the real Claude API (needs a key, costs money)",
    "local_llm: hits a local Ollama model (free, needs `ollama serve` running)",
    "live_api: hits a real local HTTP API + SQLite DB (needs uvicorn running)",
    "live_openai: hits the real OpenAI API (needs a key, costs money)",
    "live_web: hits a real public website/API (needs AGENTPROBE_LIVE_WEB=1)",
]
